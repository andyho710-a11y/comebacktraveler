name: Check services integration without deployment
on:
  pull_request:
  push:
    branches: [codex/services-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm test
      - run: npm run typecheck:services
      - run: npm audit --omit=dev
      - name: Verify production services build and index isolation
        run: |
          node scripts/services/check-config.mjs --production
          npm run build
          npm test
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PUBLIC_SUPABASE_URL: ${{ vars.SERVICES_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SERVICES_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_ENVIRONMENT: production
          PUBLIC_PILOT_ENABLED: 'true'
          PUBLIC_OPERATOR_NAME: andyho710（個人試營運）
          PUBLIC_PRIVACY_EMAIL: andyho710@gmail.com
